name: Build 7-Zip

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      doRelease:
        description: 'Publish new GitHub release'
        type: boolean
        default: false
        required: false
      buildOnly:
        description: 'Only build binaries (skip pre-checks)'
        type: boolean
        default: false
        required: false
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

jobs:
  pre_check:
    name: Pre Checks
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo Check
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [[ "$GITHUB_REPOSITORY" == "ip7z/7zip" ]]; then
            echo "Scheduled builds are disabled on the upstream repository."
            exit 1
          fi

  build_7zip:
    name: Build (${{ matrix.target }})
    if: ${{ (github.event.inputs.buildOnly == 'true' && !cancelled()) || success() }}
    needs: pre_check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            ext: tar.xz
          - target: linux-arm64
            ext: tar.xz
          - target: win-x64
            ext: zip
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install cross-compilers and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            zip \
            xz-utils \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            g++-mingw-w64-x86-64

      - name: Compile Linux (x64)
        if: ${{ matrix.target == 'linux-x64' }}
        run: |
          mkdir -p staging
          TARGETS=(
            "CPP/7zip/Bundles/Alone2:7zz"
            "CPP/7zip/Bundles/Alone:7za"
            "CPP/7zip/Bundles/Alone7z:7zr"
            "CPP/7zip/UI/Console:7z"
            "CPP/7zip/Bundles/Format7zF:7z.so"
            "CPP/7zip/Bundles/SFXCon:7zCon.sfx"
          )
          for item in "${TARGETS[@]}"; do
            dir="${item%%:*}"
            bin="${item##*:}"
            make -C "$dir" -j"$(nproc)" -f makefile.gcc
            cp "$dir/_o/$bin" staging/
          done
          ./staging/7zz i

      - name: Compile Linux (arm64)
        if: ${{ matrix.target == 'linux-arm64' }}
        run: |
          mkdir -p staging
          TARGETS=(
            "CPP/7zip/Bundles/Alone2:7zz"
            "CPP/7zip/Bundles/Alone:7za"
            "CPP/7zip/Bundles/Alone7z:7zr"
            "CPP/7zip/UI/Console:7z"
            "CPP/7zip/Bundles/Format7zF:7z.so"
            "CPP/7zip/Bundles/SFXCon:7zCon.sfx"
          )
          for item in "${TARGETS[@]}"; do
            dir="${item%%:*}"
            bin="${item##*:}"
            make -C "$dir" -j"$(nproc)" -f makefile.gcc \
              CC=aarch64-linux-gnu-gcc \
              CXX=aarch64-linux-gnu-g++ \
              CPU=arm64
            cp "$dir/_o/$bin" staging/
          done
          file ./staging/7zz

      - name: Cross-compile full Windows suite (win-x64)
        if: ${{ matrix.target == 'win-x64' }}
        run: |
          mkdir -p staging
          TARGETS=(
            "CPP/7zip/Bundles/Format7zF:7z.dll:7z.dll"
            "CPP/7zip/UI/Console:7z.exe:7z.exe"
            "CPP/7zip/UI/FileManager:7zFM.exe:7zFM.exe"
            "CPP/7zip/UI/GUI:7zG.exe:7zG.exe"
            "CPP/7zip/UI/Explorer:7-zip.dll:7-zip.dll"
            "CPP/7zip/Bundles/SFXWin:7z.sfx:7z.sfx"
            "CPP/7zip/Bundles/SFXCon:7zCon.sfx:7zCon.sfx"
            "CPP/7zip/Bundles/Alone2:7zz.exe:7zz.exe"
            "C/Util/7zipUninstall:7zipUninstall.exe:Uninstall.exe"
          )
          for item in "${TARGETS[@]}"; do
            IFS=':' read -r dir out dest <<< "$item"
            echo "=== Building $dest from $dir ==="
            make -C "$dir" -j"$(nproc)" -f makefile.gcc \
              IS_MINGW=1 \
              CROSS_COMPILE=x86_64-w64-mingw32- \
              CC="x86_64-w64-mingw32-gcc-win32" \
              CXX="x86_64-w64-mingw32-g++-win32 -static-libgcc -static-libstdc++" \
              WINDRES="x86_64-w64-mingw32-windres"
            cp "$dir/_o/$out" "staging/$dest"
          done

          if [ -d "Lang" ]; then
            cp -r Lang staging/Lang
          fi

          # Verify PE format and confirm zero MinGW runtime DLL dependencies
          file staging/7z.exe staging/7zFM.exe staging/7z.dll
          x86_64-w64-mingw32-objdump -p staging/7zFM.exe | grep "DLL Name:"

      - name: Package archive
        run: |
          mkdir -p artifacts
          for doc in DOC/History.txt DOC/License.txt DOC/readme.txt DOC/descript.ion; do
            [ -f "$doc" ] && cp "$doc" staging/
          done
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            (cd staging && zip -r "../artifacts/7zip-${{ matrix.target }}-${SHORT_SHA}.zip" .)
          else
            tar -cJf "artifacts/7zip-${{ matrix.target }}-${SHORT_SHA}.tar.xz" -C staging .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-${{ matrix.target }}
          overwrite: true
          path: artifacts/*

  publish_release:
    name: Publish Release
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event.inputs.doRelease == 'true') && needs.build_7zip.result == 'success' }}
    needs: build_7zip
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 7zip-*
          merge-multiple: true
          path: artifacts

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sha256sum *.{zip,tar.xz} > checksums.sha256
          cat checksums.sha256

      - name: Create dated GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          RELDATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TAGNAME="autobuild-$(date -u +'%Y-%m-%d-%H-%M')"
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$TAGNAME" \
            --target "${{ github.ref_name }}" \
            --title "Auto-Build $RELDATE ($SHORT_SHA)" \
            --notes "Automated 7-Zip build from commit \`$GITHUB_SHA\`." \
            artifacts/*.{zip,tar.xz} artifacts/checksums.sha256

      - name: Update rolling 'latest' release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release delete --cleanup-tag --yes "latest" || true
          sleep 5
          gh release create "latest" \
            --target "${{ github.ref_name }}" \
            --title "Latest Auto-Build ($SHORT_SHA)" \
            --notes "Rolling latest build from commit \`$GITHUB_SHA\`." \
            artifacts/*.{zip,tar.xz} artifacts/checksums.sha256
